# Local development stack: API + PostgreSQL. The API applies migrations on startup.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart
      POSTGRES_DB: smart_english
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d smart_english"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://smart:smart@postgres:5432/smart_english
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pgdata:
