# One-time helper: unpacks project.zip (uploaded from the browser) into the repo, then deploys the web app.
name: Unpack uploaded project
on:
  push:
    paths: ["project.zip"]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          test -f project.zip || { echo "nothing to unpack"; exit 0; }
          unzip -o project.zip -d .
          rm project.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Smart English project (phases 1-2)"
          git push
      - name: Deploy web app to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
