name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smart
          POSTGRES_PASSWORD: smart
          POSTGRES_DB: smart_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smart" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      - run: pip install -r requirements-dev.txt
      - name: Tests against real PostgreSQL via asyncpg (production driver)
        env:
          TEST_DATABASE_URL: postgresql://smart:smart@localhost:5432/smart_test
        run: pytest -q -rs

  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No API keys in client code (web + iOS)
        run: ./scripts/check_no_secrets.sh
