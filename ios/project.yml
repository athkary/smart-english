# XcodeGen spec — run `xcodegen generate` inside ios/ to produce SmartEnglish.xcodeproj
name: SmartEnglish
options:
  bundleIdPrefix: com.smartenglishai
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
configs:
  Debug: debug
  Release: release
targets:
  SmartEnglish:
    type: application
    platform: iOS
    sources:
      - path: SmartEnglish
    info:
      path: SmartEnglish/Resources/Info.plist
      properties:
        CFBundleDisplayName: Smart English
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSMicrophoneUsageDescription: "Smart English uses the microphone so you can talk with your English teacher. يستخدم التطبيق الميكروفون لتتحدث مع معلم اللغة الإنجليزية."
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true      # localhost/LAN dev server only; public hosts require HTTPS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smartenglishai.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          API_BASE_URL: "http://localhost:8000"
        Release:
          API_BASE_URL: "https://api.smartenglish.example"   # replace with real domain (Phase 2)
  SmartEnglishTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmartEnglishTests]
    dependencies:
      - target: SmartEnglish
schemes:
  SmartEnglish:
    build:
      targets:
        SmartEnglish: all
        SmartEnglishTests: [test]
    test:
      targets: [SmartEnglishTests]
